<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINI GAME - HÓA THÂN THÀNH IDOL</title>

    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --font-primary: 'Montserrat', sans-serif;
      }

      @layer base {
        button {
          cursor: pointer;
        }
      }
    </style>
  </head>

  <body class="bg-slate-950 text-slate-100 font-primary h-screen w-screen overflow-hidden selection:bg-rose-500 selection:text-white flex flex-col items-center justify-center">
    <div id="ping-widget" class="fixed top-3 left-3 flex items-center gap-2 px-2.5 py-1.5 bg-slate-900/50 backdrop-blur border border-slate-700/30 rounded-lg shadow z-50">
      <svg
        id="wifi-icon"
        class="size-7 text-emerald-400 opacity-70 transition-colors duration-300"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          id="wifi-path"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"
        ></path>
      </svg>
      <span class="text-xs md:text-xl font-bold opacity-70"><span id="ping-value" class="text-emerald-400">42</span>ms</span>
    </div>

    <main class="relative w-full h-full flex flex-col items-center justify-center p-2 md:p-4">
      <div id="screen-home" class="w-full max-w-7xl flex flex-col items-center gap-4 transition-all duration-300 opacity-100 scale-100">
        <div class="text-center">
          <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-orange-500 pb-1">HÓA THÂN THÀNH IDOL</h1>
          <p class="text-xs md:text-base lg:text-xl text-slate-400 max-w-3xl mx-auto px-4 leading-relaxed">Chọn 1 idol để hóa thân. Tôi sẽ đoán bạn là ai 😏</p>
        </div>

        <div id="idol-grid" class="grid grid-cols-5 gap-2 md:gap-y-8 md:gap-x-12 w-full"></div>

        <button
          id="btn-start"
          class="outline-none focus:outline-none focus:ring-0 select-none group relative px-6 py-3 md:px-8 mt-2 bg-rose-600 hover:bg-rose-500 text-white font-bold text-base md:text-xl rounded-xl shadow-[0_0_20px_-5px_rgba(225,29,72,0.6)] transition-all active:scale-95 overflow-hidden"
        >
          <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
          <span class="relative">BẮT ĐẦU </span>
        </button>
      </div>

      <div id="screen-question" class="hidden w-full max-w-5xl flex-col items-center gap-4 md:gap-6 lg:gap-8 transition-all duration-300 opacity-0 scale-95">
        <div class="w-full flex items-center justify-between px-4">
          <span id="question-counter" class="text-rose-500 font-bold tracking-widest text-xs md:text-base lg:text-xl uppercase"></span>
          <div class="flex gap-1.5 lg:gap-2" id="progress-dots"></div>
        </div>

        <h2 id="question-title" class="text-xl md:text-3xl lg:text-5xl font-bold text-center text-white leading-tight"></h2>

        <div id="question-grid" class="grid grid-cols-4 gap-3 md:gap-6 w-full bg-slate-900/50 p-4 md:p-6 lg:p-8 rounded-[24px] border border-slate-800 mt-2"></div>

        <div class="flex w-full gap-4 md:gap-6 lg:gap-8 mt-2 px-4">
          <button
            id="btn-back"
            class="outline-none focus:outline-none focus:ring-0 select-none flex-1 py-3 md:py-4 lg:py-5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-bold text-sm md:text-xl lg:text-2xl rounded-xl transition-all active:scale-95 shadow-lg"
          >
            QUAY LẠI
          </button>
          <button
            id="btn-next"
            class="outline-none focus:outline-none focus:ring-0 select-none flex-1 py-3 md:py-4 lg:py-5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm md:text-xl lg:text-2xl rounded-xl transition-all active:scale-95 shadow-[0_0_20px_-5px_rgba(79,70,229,0.5)]"
          >
            CÂU TIẾP THEO
          </button>
        </div>
      </div>
    </main>

    <script src="./data.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
